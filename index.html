<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevPalette — Color Wheel for Developers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e10;--bg2:#18181c;--bg3:#1f1f25;
  --border:#2e2e38;--border2:#3a3a48;
  --text:#e8e8f0;--text2:#8888a0;--text3:#5a5a72;
  --radius:8px;--mono:'JetBrains Mono','Fira Code','Cascadia Code',monospace;
  --accent:#5b8fff;
}
html{background:var(--bg);color:var(--text);font-family:var(--mono)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
header{width:100%;max-width:900px;display:flex;align-items:baseline;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
header h1{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
header span{font-size:12px;color:var(--text3)}
.app{width:100%;max-width:900px;display:flex;flex-direction:column;gap:20px}
.top{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
#wheelWrap{position:relative;width:240px;height:240px;cursor:crosshair;flex-shrink:0;margin:0 auto}
canvas{display:block;border-radius:50%;border:1px solid var(--border)}
#cursor{position:absolute;width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px #000;transform:translate(-50%,-50%);pointer-events:none}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px}
.ctrl-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text2)}
.ctrl-row label{width:70px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em}
.ctrl-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer}
.ctrl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);cursor:pointer;border:2px solid var(--bg)}
.ctrl-row span{width:36px;text-align:right;color:var(--text);font-size:12px}
.hex-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#previewSwatch{width:40px;height:40px;border-radius:var(--radius);border:1px solid var(--border);flex-shrink:0}
input.hex-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:14px;font-weight:500;padding:8px 10px;width:110px;outline:none}
input.hex-input:focus{border-color:var(--accent)}
button{font-family:var(--mono);font-size:11px;padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;text-transform:lowercase}
button:hover{border-color:var(--text3);color:var(--text);background:var(--bg3)}
.btn-primary{border-color:var(--accent);color:var(--accent)}
.btn-primary:hover{background:rgba(91,143,255,.12)}
.scheme-tabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{font-size:10px;padding:4px 10px}
.stab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.divider{border:none;border-top:1px solid var(--border)}
.section-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.palette-row{display:flex;gap:10px;flex-wrap:wrap;min-height:44px;align-items:flex-start}
.swatch{position:relative;width:76px;height:76px;border-radius:var(--radius);cursor:pointer;border:1px solid rgba(255,255,255,.1);transition:transform .12s,box-shadow .12s;flex-shrink:0}
.swatch:hover{transform:scale(1.07);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.swatch-label{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.5)}
.empty-msg{font-size:12px;color:var(--text3);align-self:center}
.export-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code-out{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;line-height:1.7;color:var(--text2);white-space:pre;overflow-x:auto;display:none;max-height:200px;overflow-y:auto;tab-size:2}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 16px;border-radius:var(--radius);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999}
.contrast-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.contrast-info{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text2)}
.kw-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.kw-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;flex:1;min-width:120px;outline:none}
input.kw-input:focus{border-color:var(--accent)}
input.kw-input::placeholder{color:var(--text3)}
.server-list{display:flex;flex-direction:column;gap:2px}
.server-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.server-item:last-child{border-bottom:none}
.server-kw{font-size:12px;font-weight:600;color:var(--text);flex:1;min-width:80px}
.server-chips{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0}
.chip{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.server-meta{font-size:10px;color:var(--text3);width:100%;margin-top:-4px}
input.num-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:12px;padding:4px 8px;width:64px;text-align:center;outline:none}
input.num-input:focus{border-color:var(--accent)}
@media(max-width:600px){
  body{padding:16px 12px}
  .top{grid-template-columns:1fr}
  .swatch{width:calc(25% - 8px);height:64px}
  .swatch-label{font-size:8px;bottom:3px}
  .hex-row{flex-wrap:nowrap}
  input.hex-input{min-width:0;flex:1}
  .export-row{gap:6px}
  .export-row button{font-size:10px;padding:5px 8px}
  .code-out{font-size:11px;padding:10px 12px}
}
</style>
</head>
<body>
<header>
  <h1>DevPalette</h1>
  <span>color wheel + harmony generator for developers</span>
</header>
<div class="app">
  <div class="top">
    <div id="wheelWrap">
      <canvas id="wheel" width="240" height="240"></canvas>
      <div id="cursor"></div>
    </div>
    <div class="panel">
      <div class="ctrl-row"><label>Hue</label><input type="range" id="hSlider" min="0" max="359" value="210"><span id="hVal">210</span></div>
      <div class="ctrl-row"><label>Saturation</label><input type="range" id="sSlider" min="10" max="100" value="80"><span id="sVal">80</span></div>
      <div class="ctrl-row"><label>Lightness</label><input type="range" id="lSlider" min="5" max="95" value="55"><span id="lVal">55</span></div>
      <div class="hex-row">
        <div id="previewSwatch"></div>
        <input class="hex-input" id="hexInput" value="#1a80e5" placeholder="#000000"/>
        <button id="copyHex">copy hex</button>
        <button id="addBtn" class="btn-primary">+ save</button>
      </div>
      <div class="contrast-info" id="contrastInfo"></div>
      <div class="section-label">Harmony</div>
      <div class="scheme-tabs">
        <button class="stab active" data-scheme="complement">complement</button>
        <button class="stab" data-scheme="triadic">triadic</button>
        <button class="stab" data-scheme="analogous">analogous</button>
        <button class="stab" data-scheme="split">split-complement</button>
        <button class="stab" data-scheme="tetradic">tetradic</button>
        <button class="stab" data-scheme="tints">tints</button>
        <button class="stab" data-scheme="shades">shades</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="section-label">Harmony Preview — click swatch to save</div>
  <div class="palette-row" id="harmonyRow"></div>

  <div class="divider"></div>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="section-label">Saved Palette</div>
    <div style="display:flex;gap:6px">
      <button id="sortBtn">sort by hue</button>
      <button id="clearBtn">clear all</button>
    </div>
  </div>
  <div class="palette-row" id="savedRow"><span class="empty-msg">No colors saved yet</span></div>

  <div class="divider"></div>
  <div class="export-row">
    <div class="section-label">Export</div>
    <button data-fmt="css">CSS vars</button>
    <button data-fmt="tailwind">Tailwind</button>
    <button data-fmt="json">JSON</button>
    <button data-fmt="scss">SCSS</button>
    <button data-fmt="hex">hex list</button>
    <button data-fmt="hsl">HSL list</button>
    <button id="copyExport" class="btn-primary">copy output ↗</button>
  </div>
  <div class="code-out" id="codeOut"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const wheel=document.getElementById('wheel'),ctx=wheel.getContext('2d');
const cur=document.getElementById('cursor'),wrap=document.getElementById('wheelWrap');
const hSlider=document.getElementById('hSlider'),sSlider=document.getElementById('sSlider'),lSlider=document.getElementById('lSlider');
const hVal=document.getElementById('hVal'),sVal=document.getElementById('sVal'),lVal=document.getElementById('lVal');
const hexInput=document.getElementById('hexInput'),previewSwatch=document.getElementById('previewSwatch');
const harmonyRow=document.getElementById('harmonyRow'),savedRow=document.getElementById('savedRow');
const codeOut=document.getElementById('codeOut'),contrastInfo=document.getElementById('contrastInfo');
let H=210,S=80,L=55,scheme='complement',saved=[],fmt='css';

function hsl2rgb(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}
function hsl2hex(h,s,l){return rgb2hex(...hsl2rgb(h,s,l))}
function hex2hsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h2,s2,l2=(max+min)/2;if(max===min){h2=s2=0}else{const d=max-min;s2=l2>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h2=(g-b)/d+(g<b?6:0);break;case g:h2=(b-r)/d+2;break;case b:h2=(r-g)/d+4;break}h2*=60}return[Math.round(h2),Math.round(s2*100),Math.round(l2*100)]}
function relativeLuminance(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const toL=c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);return 0.2126*toL(r)+0.7152*toL(g)+0.0722*toL(b)}
function contrast(hex1,hex2){const l1=relativeLuminance(hex1),l2=relativeLuminance(hex2);const lighter=Math.max(l1,l2),darker=Math.min(l1,l2);return((lighter+0.05)/(darker+0.05)).toFixed(2)}
function wcagGrade(ratio){if(ratio>=7)return{grade:'AAA',ok:true};if(ratio>=4.5)return{grade:'AA',ok:true};if(ratio>=3)return{grade:'AA Large',ok:true};return{grade:'Fail',ok:false}}

function drawWheel(){const cx=120,cy=120,r=116;ctx.clearRect(0,0,240,240);for(let angle=0;angle<360;angle+=0.7){const rad=angle*Math.PI/180;const x1=cx+Math.cos(rad)*3,y1=cy+Math.sin(rad)*3,x2=cx+Math.cos(rad)*r,y2=cy+Math.sin(rad)*r;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=`hsl(${angle},${S}%,${L}%)`;ctx.lineWidth=2.8;ctx.stroke()}}

function hueToXY(h){const rad=h*Math.PI/180;return{x:120+Math.cos(rad)*90,y:120+Math.sin(rad)*90}}
function updateCursor(){const{x,y}=hueToXY(H);cur.style.left=x+'px';cur.style.top=y+'px';cur.style.background=hsl2hex(H,S,L)}

function updateContrast(){const hex=hsl2hex(H,S,L);const cw=contrast(hex,'#ffffff'),cb=contrast(hex,'#000000');const gw=wcagGrade(+cw),gb=wcagGrade(+cb);contrastInfo.innerHTML=`<span>vs white: ${cw}:1 <b style="color:${gw.ok?'#4ade80':'#f87171'}">${gw.grade}</b></span><span>vs black: ${cb}:1 <b style="color:${gb.ok?'#4ade80':'#f87171'}">${gb.grade}</b></span>`}

function updatePreview(){const hex=hsl2hex(H,S,L);hexInput.value=hex;previewSwatch.style.background=hex;updateContrast()}
function updateAll(){drawWheel();updateCursor();updatePreview();renderHarmony();hVal.textContent=H;sVal.textContent=S;lVal.textContent=L}

function getScheme(){const colors=[];
if(scheme==='complement'){colors.push({h:H,s:S,l:L},{h:(H+180)%360,s:S,l:L})}
else if(scheme==='triadic'){[0,120,240].forEach(d=>colors.push({h:(H+d)%360,s:S,l:L}))}
else if(scheme==='analogous'){[-30,-15,0,15,30].forEach(d=>colors.push({h:(H+d+360)%360,s:S,l:L}))}
else if(scheme==='split'){[0,150,210].forEach(d=>colors.push({h:(H+d)%360,s:S,l:L}))}
else if(scheme==='tetradic'){[0,90,180,270].forEach(d=>colors.push({h:(H+d)%360,s:S,l:L}))}
else if(scheme==='tints'){[20,35,50,65,80].forEach(ll=>colors.push({h:H,s:S,l:ll}))}
else if(scheme==='shades'){[80,65,50,35,20].forEach(ll=>colors.push({h:H,s:S,l:ll}))}
return colors}

function isLight(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>145}
function makeSwatch(hex,addable){const d=document.createElement('div');d.className='swatch';d.style.background=hex;const lb=document.createElement('div');lb.className='swatch-label';lb.textContent=hex;lb.style.color=isLight(hex)?'rgba(0,0,0,.8)':'rgba(255,255,255,.9)';d.appendChild(lb);d.onclick=()=>{if(addable){addToSaved(hex);toast('Saved '+hex)}else{saved=saved.filter(c=>c!==hex);renderSaved()}};d.title=addable?'Click to save':'Click to remove';return d}

function renderHarmony(){harmonyRow.innerHTML='';getScheme().forEach(({h,s,l})=>{harmonyRow.appendChild(makeSwatch(hsl2hex(h,s,l),true))})}
function addToSaved(hex){if(!saved.includes(hex)){saved.push(hex);renderSaved()}}
function renderSaved(){if(!saved.length){savedRow.innerHTML='<span class="empty-msg">No colors saved yet</span>';return}savedRow.innerHTML='';saved.forEach(hex=>savedRow.appendChild(makeSwatch(hex,false)))}

function toHSLStr(hex){const[h,s,l]=hex2hsl(hex);return`hsl(${h}, ${s}%, ${l}%)`}
function getCode(){const colors=saved.length?saved:getScheme().map(({h,s,l})=>hsl2hex(h,s,l));
if(fmt==='css')return`:root {\n${colors.map((c,i)=>`  --color-${i+1}: ${c};`).join('\n')}\n}`;
if(fmt==='tailwind')return`// tailwind.config.js\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n${colors.map((c,i)=>`        'brand-${i+1}': '${c}',`).join('\n')}\n      },\n    },\n  },\n};`;
if(fmt==='json')return JSON.stringify({colors:Object.fromEntries(colors.map((c,i)=>[`color${i+1}`,c]))},null,2);
if(fmt==='scss')return colors.map((c,i)=>`$color-${i+1}: ${c};`).join('\n');
if(fmt==='hex')return colors.join('\n');
if(fmt==='hsl')return colors.map(c=>toHSLStr(c)).join('\n');
return'';}

hSlider.oninput=()=>{H=+hSlider.value;updateAll()};
sSlider.oninput=()=>{S=+sSlider.value;updateAll()};
lSlider.oninput=()=>{L=+lSlider.value;updateAll()};
hexInput.oninput=()=>{const v=hexInput.value;if(/^#[0-9a-fA-F]{6}$/.test(v)){[H,S,L]=hex2hsl(v);hSlider.value=H;sSlider.value=S;lSlider.value=L;updateAll()}};

let dragging=false;
function handleWheel(e){const rect=wrap.getBoundingClientRect();const cx=rect.left+120,cy=rect.top+120;const dx=e.clientX-cx,dy=e.clientY-cy;H=Math.round(((Math.atan2(dy,dx)*180/Math.PI)+360)%360);hSlider.value=H;updateAll()}
wrap.addEventListener('mousedown',e=>{dragging=true;handleWheel(e)});
document.addEventListener('mousemove',e=>{if(dragging)handleWheel(e)});
document.addEventListener('mouseup',()=>dragging=false);
wrap.addEventListener('touchstart',e=>{dragging=true;handleWheel(e.touches[0])},{passive:true});
document.addEventListener('touchmove',e=>{if(dragging)handleWheel(e.touches[0])},{passive:true});
document.addEventListener('touchend',()=>dragging=false);

document.querySelectorAll('.stab').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');scheme=btn.dataset.scheme;renderHarmony()}});
document.getElementById('addBtn').onclick=()=>{addToSaved(hsl2hex(H,S,L));toast('Saved!')};
document.getElementById('copyHex').onclick=()=>{navigator.clipboard.writeText(hsl2hex(H,S,L));toast('Copied!')};
document.getElementById('clearBtn').onclick=()=>{saved=[];renderSaved()};
document.getElementById('sortBtn').onclick=()=>{saved.sort((a,b)=>hex2hsl(a)[0]-hex2hsl(b)[0]);renderSaved()};
document.querySelectorAll('[data-fmt]').forEach(btn=>{btn.onclick=()=>{fmt=btn.dataset.fmt;codeOut.textContent=getCode();codeOut.style.display='block'}});
document.getElementById('copyExport').onclick=()=>{const t=codeOut.textContent;if(t){navigator.clipboard.writeText(t);toast('Copied!')}else toast('Pick a format first')};

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(t._tid);t._tid=setTimeout(()=>t.style.opacity=0,1600)}

updateAll();
</script>
</body>
</html>
