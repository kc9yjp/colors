<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPalette — Color Wheel for Developers</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23111'/%3E%3Cpath d='M16 16 L32 16 A16 16 0 0 1 29.856 24 Z' fill='rgb(255,43,43)'/%3E%3Cpath d='M16 16 L29.856 24 A16 16 0 0 1 24 29.856 Z' fill='rgb(255,162,43)'/%3E%3Cpath d='M16 16 L24 29.856 A16 16 0 0 1 16 32 Z' fill='rgb(245,245,10)'/%3E%3Cpath d='M16 16 L16 32 A16 16 0 0 1 8 29.856 Z' fill='rgb(120,255,43)'/%3E%3Cpath d='M16 16 L8 29.856 A16 16 0 0 1 2.144 24 Z' fill='rgb(43,255,43)'/%3E%3Cpath d='M16 16 L2.144 24 A16 16 0 0 1 0 16 Z' fill='rgb(43,255,162)'/%3E%3Cpath d='M16 16 L0 16 A16 16 0 0 1 2.144 8 Z' fill='rgb(10,235,235)'/%3E%3Cpath d='M16 16 L2.144 8 A16 16 0 0 1 8 2.144 Z' fill='rgb(43,120,255)'/%3E%3Cpath d='M16 16 L8 2.144 A16 16 0 0 1 16 0 Z' fill='rgb(43,43,255)'/%3E%3Cpath d='M16 16 L16 0 A16 16 0 0 1 24 2.144 Z' fill='rgb(162,43,255)'/%3E%3Cpath d='M16 16 L24 2.144 A16 16 0 0 1 29.856 8 Z' fill='rgb(255,43,245)'/%3E%3Cpath d='M16 16 L29.856 8 A16 16 0 0 1 32 16 Z' fill='rgb(255,43,120)'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>DevPalette</h1>
    <span>color wheel + harmony generator for developers</span>
  </header>
  <div class="app">
    <div class="input-tabs">
      <div class="input-tab-bar">
        <button class="input-tab active" data-tab="ai">✨ AI Prompt</button>
        <button class="input-tab" data-tab="url">🌐 URL Extract</button>
        <button class="input-tab" data-tab="server">☁️ Saved</button>
      </div>
      <div class="input-tab-content active" id="tab-ai">
        <div class="ai-row">
          <input class="ai-input" id="aiPrompt" placeholder="describe a mood (e.g. tropical sunset, cyberpunk night)"
            maxlength="100" />
          <button id="aiBtn" class="btn-primary">✨ suggest</button>
        </div>
      </div>
      <div class="input-tab-content" id="tab-url">
        <div class="ai-row">
          <input class="ai-input" id="urlInput" type="url" placeholder="https://example.com" maxlength="500" />
          <button id="urlBtn" class="btn-primary">🌐 extract</button>
        </div>
      </div>
      <div class="input-tab-content" id="tab-server">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="section-label" style="margin:0;">Saved Palettes</div>
          <button id="refreshBtn">refresh list</button>
        </div>
        <div class="server-list" id="serverList"><span class="empty-msg">Loading…</span></div>
      </div>
    </div>
    <div class="palette-row" id="aiRow"></div>
    <div class="divider"></div>
    <div class="top">
      <div id="wheelWrap">
        <canvas id="wheel" width="240" height="240"></canvas>
        <div id="cursor"></div>
      </div>
      <div class="panel">
        <div class="ctrl-row"><label>Hue</label><input type="range" id="hSlider" min="0" max="359" value="210"><span
            id="hVal">210</span></div>
        <div class="ctrl-row"><label>Saturation</label><input type="range" id="sSlider" min="10" max="100"
            value="80"><span id="sVal">80</span></div>
        <div class="ctrl-row"><label>Lightness</label><input type="range" id="lSlider" min="5" max="95" value="55"><span
            id="lVal">55</span></div>
        <div class="hex-row">
          <div id="previewSwatch"></div>
          <input class="hex-input" id="hexInput" value="#1a80e5" placeholder="#000000" />
          <button id="copyHex">copy hex</button>
          <button id="addBtn" class="btn-primary">+ save</button>
        </div>
        <div class="section-label">Harmony</div>
        <div class="scheme-tabs">
          <button class="stab active" data-scheme="complement">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            complement
          </button>
          <button class="stab" data-scheme="triadic">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="18.8" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="3.2" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            triadic
          </button>
          <button class="stab" data-scheme="analogous">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="6.5" y2="3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="8.7" y2="2.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="13.3" y2="2.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="15.5" y2="3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            analogous
          </button>
          <button class="stab" data-scheme="split">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="15.5" y2="18.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="6.5" y2="18.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            split-complement
          </button>
          <button class="stab" data-scheme="tetradic">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="2" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            tetradic
          </button>
          <button class="stab" data-scheme="tints">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="9.75" y2="2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="10.37" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11.63" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="12.25" y2="2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            tints
          </button>
          <button class="stab" data-scheme="shades">
            <svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/><line x1="11" y1="11" x2="9.25" y2="2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="10.2" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="11" y1="11" x2="11.8" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="12.75" y2="2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            shades
          </button>
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Harmony Preview — click swatch to save</div>
    <div class="palette-row" id="harmonyRow"></div>

    <div class="divider"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="section-label" style="margin:0;">Current Palette</div>
      <button id="clearBtn">clear</button>
    </div>
    <div class="contrast-info" id="contrastInfo"
      style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%"></div>



    <div class="divider"></div>
    <div class="kw-row">
      <input class="kw-input" id="kwInput" placeholder="keyword (e.g. sunset)" maxlength="40" />
      <button id="saveServerBtn" class="btn-primary">save to server ↑</button>
    </div>



    <div class="divider"></div>
    <div class="export-row">
      <div class="section-label">Export</div>
      <button data-fmt="css">CSS vars</button>
      <button data-fmt="tailwind">Tailwind</button>
      <button data-fmt="json">JSON</button>
      <button data-fmt="scss">SCSS</button>
      <button data-fmt="hex">hex list</button>
      <button data-fmt="hsl">HSL list</button>
      <button id="copyExport" class="btn-primary">copy output ↗</button>
    </div>
    <div class="code-out" id="codeOut"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>

</html>
